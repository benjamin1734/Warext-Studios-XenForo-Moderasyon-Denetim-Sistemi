name: Bilingual Release Notes Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bilingual-release-notes.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1.0.4 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 'v1.0.4' --json body --jq .body > /tmp/current.md
          cat > /tmp/en.md <<'EOF'
Warext Studios XenForo Moderation Audit System 1.0.4.

- The Audit tab was completely removed from the public main navbar.
- On the public side, moderation auditing is now accessible only from the Moderator tools menu.
- The independent Moderation Audit System section in the ACP is preserved.
- Normal users do not see any moderation-audit link in the main navigation.
- Automatic super-admin access and the normal permission system for authorized staff are preserved.
- PHP 8.1 lint, XML, navigation isolation, Moderator tools hook and ZIP integrity checks passed.
EOF
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/current.md').read_text(encoding='utf-8').rstrip()
          marker = '\n\n---\n\n## English\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip()
          en = Path('/tmp/en.md').read_text(encoding='utf-8').strip()
          Path('/tmp/final.md').write_text(base + marker + '\n' + en + '\n', encoding='utf-8')
          PY
          gh release edit 'v1.0.4' --notes-file /tmp/final.md
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true

# trigger
