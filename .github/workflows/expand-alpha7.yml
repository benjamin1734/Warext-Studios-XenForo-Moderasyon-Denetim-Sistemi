name: Expand Alpha7 source tree

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-alpha7.yml'

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Alpha7 package and source
        shell: bash
        run: |
          set -euo pipefail
          rm -f expand-alpha7-diagnostic.txt Warext-ModerationAudit-1.0.0-Alpha7.zip
          cat .alpha7/part-00 .alpha7zip/z00 > /tmp/alpha7-full.b64
          echo "combined-b64-size=$(wc -c < /tmp/alpha7-full.b64)" > expand-alpha7-diagnostic.txt
          base64 -d /tmp/alpha7-full.b64 > Warext-ModerationAudit-1.0.0-Alpha7.zip
          echo "zip-size=$(wc -c < Warext-ModerationAudit-1.0.0-Alpha7.zip)" >> expand-alpha7-diagnostic.txt
          unzip -tq Warext-ModerationAudit-1.0.0-Alpha7.zip >> expand-alpha7-diagnostic.txt 2>&1
          unzip -oq Warext-ModerationAudit-1.0.0-Alpha7.zip
          php_count=$(find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' | wc -l)
          echo "php-count=$php_count" >> expand-alpha7-diagnostic.txt
          find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('upload/src/addons/Warext/ModerationAudit')
          json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          for p in root.rglob('*.xml'):
              ET.parse(p)
          print('Alpha7 source restored and validated')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expand-alpha7-diagnostic.txt Warext-ModerationAudit-1.0.0-Alpha7.zip upload
          git commit -m "Restore complete Alpha 7 source tree"
          git push origin main
