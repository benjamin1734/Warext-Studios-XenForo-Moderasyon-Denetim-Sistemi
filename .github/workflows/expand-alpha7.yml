name: Expand Alpha7 source tree

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-alpha7.yml'

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Alpha7 from Alpha6 + patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/alpha7-build upload
          mkdir -p /tmp/alpha7-build
          cat .pack/p* > /tmp/alpha7-build/alpha6.b64
          base64 -d /tmp/alpha7-build/alpha6.b64 > /tmp/alpha7-build/alpha6.zip
          unzip -tq /tmp/alpha7-build/alpha6.zip
          unzip -q /tmp/alpha7-build/alpha6.zip
          base64 -d .alpha7patch.b64 | gzip -d > /tmp/alpha7-build/alpha7.patch
          mkdir -p upload/src/addons/Warext/ModerationAudit/Cron
          patch -p1 --batch < /tmp/alpha7-build/alpha7.patch
          find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('upload/src/addons/Warext/ModerationAudit')
          addon = json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          assert addon.get('version_string') == '1.0.0 Alpha 7', addon
          for p in root.rglob('*.xml'):
              ET.parse(p)
          hashes = json.loads((root / 'hashes.json').read_text(encoding='utf-8'))
          import hashlib
          for rel, expected in hashes.items():
              p = pathlib.Path('upload') / rel
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {rel}')
          print(f'Alpha7 restored; verified {len(hashes)} hashes')
          PY
          rm -f Warext-ModerationAudit-1.0.0-Alpha7.zip
          zip -qr Warext-ModerationAudit-1.0.0-Alpha7.zip upload
          unzip -tq Warext-ModerationAudit-1.0.0-Alpha7.zip
          printf 'restore=ok\nphp-count=%s\n' "$(find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' | wc -l)" > expand-alpha7-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload Warext-ModerationAudit-1.0.0-Alpha7.zip expand-alpha7-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete Alpha 7 source tree"
            git push origin main
          fi
