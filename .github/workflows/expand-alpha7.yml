name: Expand Alpha7 source tree

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-alpha7.yml'

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test bootstrap recovery candidates
        shell: bash
        run: |
          set +e
          DIAG=bootstrap-recovery-diagnostic.txt
          : > "$DIAG"

          test_candidate() {
            name="$1"; shift
            out="/tmp/${name}.b64"
            : > "$out"
            for f in "$@"; do cat "$f" >> "$out"; done
            size=$(wc -c < "$out")
            echo "== $name ==" >> "$DIAG"
            echo "size=$size mod4=$((size % 4))" >> "$DIAG"
            base64 -d "$out" > "/tmp/${name}.zip" 2>> "$DIAG"
            b64=$?
            echo "base64-exit=$b64 zip-size=$(wc -c < /tmp/${name}.zip)" >> "$DIAG"
            file "/tmp/${name}.zip" >> "$DIAG" 2>&1
            unzip -tq "/tmp/${name}.zip" >> "$DIAG" 2>&1
            uz=$?
            echo "unzip-test-exit=$uz" >> "$DIAG"
            if [ "$uz" -eq 0 ]; then
              rm -rf "/tmp/${name}-x" && mkdir -p "/tmp/${name}-x"
              (cd "/tmp/${name}-x" && unzip -q "/tmp/${name}.zip")
              addon="/tmp/${name}-x/upload/src/addons/Warext/ModerationAudit/addon.json"
              if [ -f "$addon" ]; then
                echo -n "addon-version=" >> "$DIAG"
                php -r '$j=json_decode(file_get_contents($argv[1]),true); echo $j["version_string"] ?? "missing";' "$addon" >> "$DIAG" 2>&1
                echo >> "$DIAG"
              fi
              echo "files=$(find /tmp/${name}-x -type f | wc -l)" >> "$DIAG"
            fi
          }

          common_tail=(.bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06)
          test_candidate c1 .bootstrap/part-00 .bootstrap/part-01 "${common_tail[@]}" .bootstrap/part-07
          test_candidate c2 .bootstrap/part-00 .bootstrap/part-01-00 .bootstrap/part-01-01 .bootstrap/part-01-02 .bootstrap/part-01-03 .bootstrap/part-01-04 "${common_tail[@]}" .bootstrap/part-07
          test_candidate c3 .bootstrap/part-00 .bootstrap/part-01 "${common_tail[@]}" .bootstrap/part-07-00
          test_candidate c4 .bootstrap/part-00 .bootstrap/part-01-00 .bootstrap/part-01-01 .bootstrap/part-01-02 .bootstrap/part-01-03 .bootstrap/part-01-04 "${common_tail[@]}" .bootstrap/part-07-00

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIAG"
          if ! git diff --cached --quiet; then
            git commit -m "Diagnose bootstrap recovery candidates"
            git push origin main
          fi
          exit 0
