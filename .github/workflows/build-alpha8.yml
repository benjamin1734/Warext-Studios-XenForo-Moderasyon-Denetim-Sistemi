name: Build Alpha 8

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-alpha8.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Alpha 8
        run: python3 .github/scripts/integrate_alpha8.py

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate metadata and hashes
        run: python3 .github/scripts/validate_alpha8.py

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -f Warext-ModerationAudit-1.0.0-Alpha8.zip
          zip -qr Warext-ModerationAudit-1.0.0-Alpha8.zip upload
          unzip -tq Warext-ModerationAudit-1.0.0-Alpha8.zip

      - name: Commit Alpha 8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload README.md Warext-ModerationAudit-1.0.0-Alpha8.zip
          if ! git diff --cached --quiet; then
            git commit -m "Alpha 8: appeals suggestions and management responses"
            git push origin main
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.0-alpha8"
          ZIP="Warext-ModerationAudit-1.0.0-Alpha8.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target main --title "Warext Moderation Audit 1.0.0 Alpha 8" --notes "Adım 8/10: itiraz, öneri ve denetlenebilir yönetim dönüşü katmanı. Özgün başvuru içerikleri değiştirilemez; yönetim olayları SHA-256 bütünlük doğrulamalıdır."
          fi
