name: Alpha7 bootstrap
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-alpha7.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean repository
        shell: bash
        run: |
          set -euo pipefail
          cat .pack/p* > /tmp/alpha6.b64
          base64 -d /tmp/alpha6.b64 > /tmp/alpha6.zip
          unzip -tq /tmp/alpha6.zip
          rm -rf upload
          unzip -q /tmp/alpha6.zip
          base64 -d .alpha7patch.b64 | gzip -d > /tmp/alpha7.patch
          mkdir -p upload/src/addons/Warext/ModerationAudit/Cron
          patch -p1 --batch < /tmp/alpha7.patch
          test "$(php -r '$j=json_decode(file_get_contents("upload/src/addons/Warext/ModerationAudit/addon.json"),true); echo $j["version_string"] ?? "";')" = "1.0.0 Alpha 7"
          find upload/src/addons/Warext/ModerationAudit -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          python3 - <<'PY'
          import hashlib, json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('upload/src/addons/Warext/ModerationAudit')
          for p in root.rglob('*.xml'):
              ET.parse(p)
          json.loads((root / 'addon.json').read_text(encoding='utf-8'))
          hashes = json.loads((root / 'hashes.json').read_text(encoding='utf-8'))
          for rel, expected in hashes.items():
              p = pathlib.Path('upload') / rel
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {rel}')
          print(f'verified {len(hashes)} hashes')
          PY
          rm -f Warext-ModerationAudit-1.0.0-Alpha7.zip Warext-ModerationAudit-1.0.0-Alpha7.zip.b64
          zip -qr Warext-ModerationAudit-1.0.0-Alpha7.zip upload
          unzip -tq Warext-ModerationAudit-1.0.0-Alpha7.zip
          mkdir -p /tmp/clean
          cp -a README.md Warext-ModerationAudit-1.0.0-Alpha7.zip upload /tmp/clean/
          git config user.name "benjamin1734"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan alpha7-clean
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/clean/. .
          git add -A
          git commit -m "1.0.0-alpha.7"
          git branch -M main
          git push --force origin main
